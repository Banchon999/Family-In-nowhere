<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ครอบครัวไร้ถิ่น</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16120f">
<meta name="description" content="เกมเอาชีวิตรอดแนวครอบครัวบนมือถือ สร้างบ้าน เลี้ยงลูก สืบทอดตระกูล">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <header id="top">
    <div class="clock">
      <b id="tDay">วัน 1</b>
      <span id="tTime"></span>
      <span id="tTemp"></span>
      <small id="tSeason"></small>
    </div>
    <div id="speed">
      <button id="bTrader" class="trader" hidden title="พ่อค้า">🐫</button>
      <button data-sp="0" title="หยุด">⏸</button>
      <button data-sp="1" title="ปกติ">▶</button>
      <button data-sp="2" title="เร็ว x2">▶▶</button>
      <button data-sp="4" title="เร็ว x4">⏩</button>
    </div>
  </header>
  <div id="res"></div>
  <div id="fam"></div>
  <button id="quest" hidden><em>🎯</em><span></span></button>
  <div id="toasts"></div>

  <div id="hint" hidden><span id="hintText"></span><button id="hintDone" class="btn primary">เสร็จ</button></div>
  <div id="info" hidden></div>

  <section id="sheet" hidden>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="ปิด">✕</button></div>
    <div id="sheetBody"></div>
  </section>

  <nav id="bar">
    <button data-s="orders"><span>🪓</span>สั่งงาน</button>
    <button data-s="build"><span>🏗️</span>สร้าง</button>
    <button data-s="zone"><span>🗺️</span>โซน</button>
    <button data-s="work"><span>👷</span>งาน</button>
    <button data-s="research"><span>🔬</span>วิจัย</button>
    <button data-s="family"><span>👪</span>ครอบครัว</button>
    <button data-s="menu"><span>☰</span>เมนู</button>
  </nav>

  <div id="modal" hidden><div id="modalCard" class="card"></div></div>
  <div id="menu" hidden></div>
</div>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/world.js"></script>
<script src="js/path.js"></script>
<script src="js/pawn.js"></script>
<script src="js/creatures.js"></script>
<script src="js/events.js"></script>
<script src="js/sprites.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
</body>
</html>
